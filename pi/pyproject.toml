[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-robot-pi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "opencv-python-headless>=4.8"]

[project.scripts]
robotd = "robot.bootstrap:main"
robotctl = "robot.remote.cli:main"

[tool.setuptools.packages.find]
where = ["."]
